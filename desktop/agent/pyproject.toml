[project]
name = "phoney-agent"
version = "0.2.0"
description = "Desktop agent for Phoney: metrics, allowlisted actions and AI-tool events for a phone control panel."
requires-python = ">=3.13"
license = "MIT"  # full text in LICENSE at the repository root
authors = [{ name = "moh05-a" }]
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3.13", "Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "psutil>=6.1",
    "sqlalchemy>=2.0.36",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]
gpu = ["nvidia-ml-py>=12.560"]
# Volume level and now playing on Windows.
audio = [
    "pycaw>=20240210; sys_platform == 'win32'",
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
]
# System-tray icon.
tray = ["pystray>=0.19", "pillow>=10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/api/local.py" = ["E501"]  # inline HTML and CSS for the PC-only pages
"tests/*" = ["E501"]
