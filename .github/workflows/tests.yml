name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev,audio,tray]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
